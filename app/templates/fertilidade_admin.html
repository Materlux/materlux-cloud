<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fertilidade — Aprovação de médicos</title>
<style>
  :root{--rose:#b76e79;--rose-d:#9c5a65;--ink:#3a2c31;--bg:#f7f1ef;--soft:#8a7a7e;--line:#e3d7d5}
  *{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  body{margin:0;background:var(--bg);color:var(--ink)}
  .wrap{max-width:840px;margin:0 auto;padding:26px 18px 60px}
  h1{font-size:22px;margin:0 0 4px}.sub{color:var(--soft);font-size:13px;margin:0 0 18px}
  .filtros{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .filtros button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
  .filtros button.active{background:var(--rose);color:#fff;border-color:var(--rose)}
  .medico{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);
    padding:16px 18px;margin-bottom:14px}
  .medico h3{margin:0 0 2px;font-size:17px}
  .meta{color:var(--soft);font-size:13px;margin:2px 0}
  .badge{float:right;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
  .b-pendente{background:#fff4e0;color:#a06800}.b-aprovado{background:#e3f5ea;color:#2e7d5b}
  .b-rejeitado{background:#fde8e6;color:#c0392b}
  .warn{color:#c0392b;font-size:12px}
  .acoes{margin-top:12px;display:flex;gap:10px}
  .acoes button{padding:9px 18px;border:0;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
  .ap{background:#2e7d5b;color:#fff}.rej{background:#fff;border:1px solid var(--line)!important;color:#c0392b}
  .obs{margin-top:8px;font-size:14px;background:var(--bg);border-radius:8px;padding:9px 11px}
  .empty{text-align:center;color:var(--soft);padding:40px}
  a.voltar{color:var(--rose-d);font-size:13px;text-decoration:none}
</style></head>
<body>
<div class="wrap">
  <a class="voltar" href="/app">← Voltar ao painel</a>
  <h1>Médicos — Fertilidade Sem Segredos</h1>
  <p class="sub">Valide o CRM e os dados antes de aprovar. Aprovados aparecem na busca
     pública e disparam aviso por WhatsApp às pacientes em espera no raio.</p>
  <div class="filtros">
    <button data-f="pendente" class="active" onclick="carregar('pendente')">Pendentes</button>
    <button data-f="aprovado" onclick="carregar('aprovado')">Aprovados</button>
    <button data-f="rejeitado" onclick="carregar('rejeitado')">Rejeitados</button>
    <button data-f="todos" onclick="carregar('todos')">Todos</button>
  </div>
  <div id="lista"></div>
</div>
<script>
let filtro='pendente';
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function carregar(f){
  filtro=f;
  document.querySelectorAll('.filtros button').forEach(b=>b.classList.toggle('active',b.dataset.f===f));
  const el=document.getElementById('lista');
  el.innerHTML='<div class="empty">Carregando…</div>';
  const r=await fetch('/api/fertilidade/admin/medicos?status='+f);
  if(r.status===401){ location.href='/login'; return; }
  const arr=await r.json();
  if(!arr.length){ el.innerHTML='<div class="empty">Nenhum médico neste filtro.</div>'; return; }
  el.innerHTML=arr.map(card).join('');
}
function card(m){
  const b='b-'+m.status;
  return '<div class="medico" id="med-'+m.id+'">'+
    '<span class="badge '+b+'">'+m.status+'</span>'+
    '<h3>'+esc(m.nome)+'</h3>'+
    (m.especialidade?'<div class="meta">'+esc(m.especialidade)+'</div>':'')+
    '<div class="meta">CRM '+esc(m.crm)+'</div>'+
    '<div class="meta">'+esc(m.endereco||'—')+'</div>'+
    '<div class="meta">Contato: '+esc(m.telefone||'—')+(m.email?' · '+esc(m.email):'')+'</div>'+
    (m.geocodificado?'':'<div class="warn">⚠ Endereço não geolocalizado — não aparecerá na busca por proximidade.</div>')+
    (m.observacoes?'<div class="obs">'+esc(m.observacoes)+'</div>':'')+
    (m.status==='pendente'?
      '<div class="acoes">'+
        '<button class="ap" onclick="acao('+m.id+',\'aprovar\')">Aprovar</button>'+
        '<button class="rej" onclick="acao('+m.id+',\'rejeitar\')">Rejeitar</button>'+
      '</div>':'')+
    '</div>';
}
async function acao(id, tipo){
  const r=await fetch('/api/fertilidade/admin/medicos/'+id+'/'+tipo,{method:'POST'});
  const j=await r.json();
  if(!r.ok){ alert(j.detail||'Erro'); return; }
  if(tipo==='aprovar' && j.pacientes_avisadas>0){
    alert('Aprovado. '+j.pacientes_avisadas+' paciente(s) em espera avisada(s) por WhatsApp.');
  }
  carregar(filtro);
}
carregar('pendente');
</script>
</body></html>
